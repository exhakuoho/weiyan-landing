<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="兩種用 AI 的方式，作業都全對，但留下的能力不同">
 <rect x="0" y="0" width="800" height="450" fill="#101114"/>
 <text x="400" y="36" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="23" font-weight="bold">兩個孩子作業都全對，差別在哪裡？</text>

 <line x1="400" y1="58" x2="400" y2="432" stroke="#585B63" stroke-width="1" stroke-dasharray="5 6"/>

 <rect x="36" y="64" width="330" height="36" rx="8" fill="#F2803C"/>
 <text x="201" y="88" text-anchor="middle" fill="#101114" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="17" font-weight="bold">直接要答案</text>

 <rect x="434" y="64" width="330" height="36" rx="8" fill="#2F7DE1"/>
 <text x="599" y="88" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="17" font-weight="bold">只要一個提示</text>

 <rect x="36" y="118" width="330" height="44" rx="8" fill="none" stroke="#F2803C" stroke-width="1.5"/>
 <text x="201" y="146" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="15">「這題答案是什麼」</text>

 <rect x="434" y="118" width="330" height="44" rx="8" fill="none" stroke="#2F7DE1" stroke-width="1.5"/>
 <text x="599" y="146" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="15">先自己試五分鐘</text>

 <path d="M201 162 L201 182" stroke="#585B63" stroke-width="1.5"/>
 <path d="M196 176 L201 184 L206 176 Z" fill="#585B63"/>
 <path d="M599 162 L599 182" stroke="#585B63" stroke-width="1.5"/>
 <path d="M594 176 L599 184 L604 176 Z" fill="#585B63"/>

 <rect x="36" y="186" width="330" height="44" rx="8" fill="none" stroke="#F2803C" stroke-width="1.5"/>
 <text x="201" y="214" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="15">抄下完整解法</text>

 <rect x="434" y="186" width="330" height="44" rx="8" fill="none" stroke="#2F7DE1" stroke-width="1.5"/>
 <text x="599" y="214" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="15">卡住，再要一句提示</text>

 <path d="M201 230 L201 250" stroke="#585B63" stroke-width="1.5"/>
 <path d="M196 244 L201 252 L206 244 Z" fill="#585B63"/>
 <path d="M599 230 L599 250" stroke="#585B63" stroke-width="1.5"/>
 <path d="M594 244 L599 252 L604 244 Z" fill="#585B63"/>

 <rect x="36" y="254" width="330" height="44" rx="8" fill="none" stroke="#585B63" stroke-width="1.5"/>
 <text x="201" y="282" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="15">作業全對</text>

 <rect x="434" y="254" width="330" height="44" rx="8" fill="none" stroke="#585B63" stroke-width="1.5"/>
 <text x="599" y="282" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="15">作業全對</text>

 <text x="400" y="320" text-anchor="middle" fill="#9A8DFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="15">到這裡，大人看到的東西一模一樣</text>

 <path d="M201 332 L201 356" stroke="#585B63" stroke-width="1.5"/>
 <path d="M196 350 L201 358 L206 350 Z" fill="#585B63"/>
 <path d="M599 332 L599 356" stroke="#585B63" stroke-width="1.5"/>
 <path d="M594 350 L599 358 L604 350 Z" fill="#585B63"/>

 <rect x="36" y="360" width="330" height="52" rx="8" fill="#F2803C"/>
 <text x="201" y="382" text-anchor="middle" fill="#101114" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="16" font-weight="bold">拔掉 AI 再考一次</text>
 <text x="201" y="402" text-anchor="middle" fill="#101114" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="15">卡住：虛假精熟</text>

 <rect x="434" y="360" width="330" height="52" rx="8" fill="#2F7DE1"/>
 <text x="599" y="382" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="16" font-weight="bold">拔掉 AI 再考一次</text>
 <text x="599" y="402" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="15">自己做得出來</text>

 <text x="400" y="436" text-anchor="middle" fill="#585B63" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">差別不在作業，在卡住的那五分鐘有沒有發生</text>
</svg>
