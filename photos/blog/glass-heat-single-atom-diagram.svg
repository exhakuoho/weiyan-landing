<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="左右對照：一般玻璃裡傳熱的振動被雜亂的原子撞散，細到一個原子寬的玻璃絲則讓振動直直穿過，且熱流呈階梯狀">
 <rect x="0" y="0" width="800" height="450" fill="#101114"/>
 <text x="400" y="40" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="23" font-weight="700" text-anchor="middle">玻璃擋熱，擋的是「亂」，不是材料</text>
 <line x1="400" y1="62" x2="400" y2="432" stroke="#585B63" stroke-width="1.5" stroke-dasharray="6 6"/>

 <text x="207" y="92" fill="#F2803C" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" text-anchor="middle">一般玻璃（厚的）</text>
 <text x="207" y="116" fill="#585B63" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="15" text-anchor="middle">原子排列雜亂</text>
 <g fill="#585B63" opacity="0.55">
  <circle cx="72" cy="158" r="7"/><circle cx="128" cy="186" r="7"/><circle cx="96" cy="228" r="7"/>
  <circle cx="166" cy="148" r="7"/><circle cx="214" cy="182" r="7"/><circle cx="178" cy="232" r="7"/>
  <circle cx="252" cy="152" r="7"/><circle cx="300" cy="190" r="7"/><circle cx="262" cy="236" r="7"/>
  <circle cx="340" cy="162" r="7"/><circle cx="348" cy="222" r="7"/><circle cx="136" cy="272" r="7"/>
  <circle cx="200" cy="288" r="7"/><circle cx="276" cy="282" r="7"/><circle cx="330" cy="290" r="7"/>
  <circle cx="60" cy="256" r="7"/><circle cx="68" cy="300" r="7"/><circle cx="240" cy="212" r="7"/>
 </g>
 <polyline points="44,196 92,178 112,214 154,176 172,210 206,212 224,246 258,214 272,256 300,232" fill="none" stroke="#F2803C" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
 <polyline points="300,232 318,258 330,246" fill="none" stroke="#F2803C" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
 <text x="44" y="176" fill="#F2803C" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="16" font-weight="700">熱</text>
 <text x="207" y="352" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="17" text-anchor="middle">振動一直被撞歪、散掉</text>
 <text x="207" y="380" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="17" text-anchor="middle">熱走不遠</text>

 <text x="600" y="92" fill="#2F7DE1" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" text-anchor="middle">細到一個原子寬</text>
 <text x="600" y="116" fill="#585B63" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="15" text-anchor="middle">路上沒有空間可以亂</text>
 <line x1="432" y1="186" x2="762" y2="186" stroke="#9A8DFF" stroke-width="3.5"/>
 <polygon points="762,178 780,186 762,194" fill="#9A8DFF"/>
 <g fill="#2F7DE1">
  <circle cx="458" cy="186" r="9"/><circle cx="494" cy="186" r="9"/><circle cx="530" cy="186" r="9"/>
  <circle cx="566" cy="186" r="9"/><circle cx="602" cy="186" r="9"/><circle cx="638" cy="186" r="9"/>
  <circle cx="674" cy="186" r="9"/><circle cx="710" cy="186" r="9"/><circle cx="746" cy="186" r="9"/>
 </g>
 <text x="600" y="226" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="17" text-anchor="middle">振動直直穿過去</text>
 <line x1="462" y1="266" x2="462" y2="368" stroke="#585B63" stroke-width="1.5"/>
 <line x1="462" y1="368" x2="760" y2="368" stroke="#585B63" stroke-width="1.5"/>
 <polyline points="470,362 520,362 520,340 570,340 570,318 620,318 620,296 670,296 670,274 720,274" fill="none" stroke="#9A8DFF" stroke-width="3.5" stroke-linejoin="round"/>
 <text x="440" y="320" fill="#585B63" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="14" text-anchor="middle" transform="rotate(-90 440 320)">熱流</text>
 <text x="600" y="396" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="17" text-anchor="middle">熱流不是連續的，是一階一階</text>
 <text x="600" y="424" fill="#9A8DFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="15" text-anchor="middle">一階 ≈ 單一通道量子上限的 40%</text>
</svg>
