<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
 <rect x="0" y="0" width="800" height="450" fill="#101114"/>
 <text x="400" y="36" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="24" font-weight="700">大的比較耐久？恆星剛好相反</text>

 <rect x="30" y="54" width="360" height="40" rx="6" fill="none" stroke="#585B63" stroke-width="1.5"/>
 <text x="210" y="79" text-anchor="middle" fill="#585B63" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="14">直覺：越大的星撐得越久</text>
 <rect x="410" y="54" width="360" height="40" rx="6" fill="none" stroke="#9A8DFF" stroke-width="1.5"/>
 <text x="590" y="79" text-anchor="middle" fill="#9A8DFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="14">實際：越重的星燒得越快</text>

 <circle cx="55" cy="145" r="26" fill="#F2803C"/>
 <text x="92" y="141" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">1.44 太陽質量</text>
 <text x="92" y="159" fill="#585B63" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="11">白矮星的前身</text>
