 <text x="400" y="412" text-anchor="middle" fill="#585B63" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="12">依質光關係（亮度正比於質量的 3.5 次方）推得：壽命反比於質量的 2.5 次方</text>
 <text x="400" y="432" text-anchor="middle" fill="#585B63" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="12">以太陽 100 億年為基準的粗估，用來看趨勢，不是精確值</text>
