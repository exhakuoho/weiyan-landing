 <text x="92" y="229" fill="#585B63" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="11">太陽（參考值）</text>
 <rect x="250" y="197" width="58.3" height="36" fill="#585B63"/>
 <text x="319" y="220" fill="#585B63" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="14">100 億年</text>

 <circle cx="55" cy="285" r="14" fill="#2F7DE1"/>
 <text x="92" y="281" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13">0.42 太陽質量</text>
 <text x="92" y="299" fill="#585B63" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="11">紅矮星 Aa</text>
 <rect x="250" y="267" width="513.3" height="36" fill="#2F7DE1"/>
 <text x="264" y="290" fill="#FFFFFF" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="14">約 880 億年，現在還在發光</text>

 <line x1="250" y1="330" x2="775" y2="330" stroke="#585B63" stroke-width="1.5"/>
 <line x1="250" y1="330" x2="250" y2="337" stroke="#585B63" stroke-width="1.5"/>
 <line x1="366.7" y1="330" x2="366.7" y2="337" stroke="#585B63" stroke-width="1.5"/>
