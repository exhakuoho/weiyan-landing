<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="左右對照：想像中的即時遙控，與實際上訊號來回 40 分鐘造成的 80 公尺盲走">
 <defs>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F7DE1"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#F2803C"/></marker>
  <marker id="aos" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#F2803C"/></marker>
 </defs>
 <rect width="800" height="450" fill="#101114"/>
 <g font-family="system-ui, 'Noto Sans TC', sans-serif">

  <text x="24" y="36" fill="#FFFFFF" font-size="19" font-weight="700">一般以為：搖桿即時遙控</text>
  <text x="420" y="36" fill="#FFFFFF" font-size="19" font-weight="700">實際上：一來一回 40 分鐘</text>
  <line x1="400" y1="54" x2="400" y2="432" stroke="#585B63" stroke-width="1.5" stroke-dasharray="6 6"/>

  <rect x="34" y="70" width="150" height="62" rx="8" fill="none" stroke="#2F7DE1" stroke-width="2"/>
  <text x="109" y="96" fill="#FFFFFF" font-size="14" text-anchor="middle">地球控制室</text>
  <text x="109" y="118" fill="#585B63" font-size="13" text-anchor="middle">工程師握著搖桿</text>
  <path d="M 109 136 L 109 210 L 248 210" fill="none" stroke="#2F7DE1" stroke-width="2" marker-end="url(#ab)"/>
  <text x="150" y="200" fill="#2F7DE1" font-size="14">0 秒 · 即時</text>
  <text x="290" y="238" fill="#FFFFFF" font-size="13" text-anchor="middle">火星車</text>
  <rect x="255" y="248" width="70" height="30" rx="5" fill="#2F7DE1"/>
  <circle cx="270" cy="286" r="8" fill="#585B63"/>
  <circle cx="310" cy="286" r="8" fill="#585B63"/>
  <line x1="205" y1="296" x2="385" y2="296" stroke="#585B63" stroke-width="2"/>
  <path d="M 352 296 L 362 274 L 375 296 z" fill="#F2803C"/>
  <text x="203" y="330" fill="#FFFFFF" font-size="14">看到石頭 → 立刻煞車</text>
  <text x="24" y="368" fill="#585B63" font-size="14">螢幕上是即時路況，閃得過去。</text>
  <text x="24" y="394" fill="#F2803C" font-size="15" font-weight="700">但這件事物理上做不到。</text>

  <text x="620" y="74" fill="#FFFFFF" font-size="14" text-anchor="middle">地球</text>
  <circle cx="620" cy="110" r="24" fill="#2F7DE1"/>
  <path d="M 484 306 L 600 132" fill="none" stroke="#2F7DE1" stroke-width="2" marker-end="url(#ab)"/>
  <text x="512" y="238" fill="#2F7DE1" font-size="13" text-anchor="end">畫面上行</text>
  <text x="512" y="258" fill="#2F7DE1" font-size="13" text-anchor="end">20 分鐘</text>
  <path d="M 642 132 Q 768 198 732 302" fill="none" stroke="#2F7DE1" stroke-width="2" marker-end="url(#ab)"/>
  <text x="686" y="212" fill="#2F7DE1" font-size="13">指令下行</text>
  <text x="686" y="232" fill="#2F7DE1" font-size="13">20 分鐘</text>

  <text x="478" y="288" fill="#FFFFFF" font-size="13" text-anchor="end">拍照的位置</text>
  <rect x="438" y="312" width="52" height="24" rx="4" fill="#2F7DE1"/>
  <circle cx="450" cy="342" r="6" fill="#585B63"/>
  <circle cx="478" cy="342" r="6" fill="#585B63"/>
  <text x="582" y="340" fill="#F2803C" font-size="13" text-anchor="end">石頭</text>
  <path d="M 588 346 L 601 322 L 614 346 z" fill="#F2803C"/>
  <text x="696" y="290" fill="#9A8DFF" font-size="13" text-anchor="end">煞車指令抵達</text>
  <rect x="700" y="312" width="52" height="24" rx="4" fill="none" stroke="#9A8DFF" stroke-width="2"/>
  <circle cx="712" cy="342" r="6" fill="none" stroke="#585B63" stroke-width="2"/>
  <circle cx="740" cy="342" r="6" fill="none" stroke="#585B63" stroke-width="2"/>
  <line x1="430" y1="346" x2="780" y2="346" stroke="#585B63" stroke-width="2"/>
  <line x1="470" y1="374" x2="722" y2="374" stroke="#F2803C" stroke-width="2" marker-start="url(#aos)" marker-end="url(#ao)"/>
  <text x="596" y="398" fill="#F2803C" font-size="16" font-weight="700" text-anchor="middle">盲走 80 公尺</text>
  <text x="420" y="428" fill="#9A8DFF" font-size="15" font-weight="700">所以改由車上的 AutoNav 自己判斷路線</text>
 </g>
</svg>
