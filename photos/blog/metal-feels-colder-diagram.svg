<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="直覺以為金屬比較冷，實際上兩塊板子同溫，差別在熱流速度">
  <rect x="0" y="0" width="800" height="450" fill="#101114"/>
  <g font-family="system-ui, 'Noto Sans TC', sans-serif" text-anchor="middle">
    <text x="400" y="38" fill="#FFFFFF" font-size="24" font-weight="700">摸起來冷 ≠ 溫度低</text>
    <text x="400" y="62" fill="#585B63" font-size="14">同一間房間放了一整夜的兩塊板子</text>

    <line x1="400" y1="80" x2="400" y2="376" stroke="#585B63" stroke-width="1" stroke-dasharray="5 5"/>

    <!-- 左：直覺 -->
    <text x="190" y="108" fill="#F2803C" font-size="18" font-weight="700">直覺以為的</text>
    <circle cx="332" cy="102" r="13" fill="none" stroke="#F2803C" stroke-width="2"/>
    <line x1="326" y1="96" x2="338" y2="108" stroke="#F2803C" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="338" y1="96" x2="326" y2="108" stroke="#F2803C" stroke-width="2.5" stroke-linecap="round"/>
    <text x="205" y="152" fill="#FFFFFF" font-size="15">以為是溫度不一樣</text>

    <circle cx="120" cy="202" r="15" fill="none" stroke="#F2803C" stroke-width="2"/>
    <line x1="113" y1="195" x2="127" y2="209" stroke="#F2803C" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="127" y1="195" x2="113" y2="209" stroke="#F2803C" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="65" y="240" width="110" height="28" rx="4" fill="#2F7DE1"/>
    <text x="120" y="259" fill="#FFFFFF" font-size="15" font-weight="700">18°C</text>
    <text x="120" y="290" fill="#FFFFFF" font-size="14">金屬</text>
    <text x="120" y="312" fill="#F2803C" font-size="13">「比較冷」</text>

    <rect x="235" y="240" width="110" height="28" rx="4" fill="#F2803C"/>
    <text x="290" y="259" fill="#FFFFFF" font-size="15" font-weight="700">25°C</text>
    <text x="290" y="290" fill="#FFFFFF" font-size="14">木頭</text>
    <text x="290" y="312" fill="#F2803C" font-size="13">「比較溫」</text>

    <text x="205" y="352" fill="#585B63" font-size="14">用溫度計量過就知道：這兩個數字是錯的</text>

    <!-- 右：實際 -->
    <text x="580" y="108" fill="#2F7DE1" font-size="18" font-weight="700">實際發生的</text>
    <circle cx="722" cy="102" r="13" fill="none" stroke="#2F7DE1" stroke-width="2"/>
    <polyline points="716,102 720,107 729,97" fill="none" stroke="#2F7DE1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="488" y="128" width="64" height="26" rx="8" fill="#585B63"/>
    <text x="520" y="146" fill="#FFFFFF" font-size="14">手 33°C</text>
    <rect x="648" y="128" width="64" height="26" rx="8" fill="#585B63"/>
    <text x="680" y="146" fill="#FFFFFF" font-size="14">手 33°C</text>

    <line x1="520" y1="162" x2="520" y2="222" stroke="#9A8DFF" stroke-width="15"/>
    <polygon points="520,238 507,216 533,216" fill="#9A8DFF"/>
    <line x1="680" y1="162" x2="680" y2="226" stroke="#9A8DFF" stroke-width="4"/>
    <polygon points="680,238 672,222 688,222" fill="#9A8DFF"/>

    <rect x="465" y="240" width="110" height="28" rx="4" fill="#2F7DE1"/>
    <text x="520" y="259" fill="#FFFFFF" font-size="15" font-weight="700">25°C</text>
    <text x="520" y="290" fill="#FFFFFF" font-size="14">金屬</text>
    <text x="520" y="310" fill="#585B63" font-size="12">導熱率 205</text>
    <text x="520" y="332" fill="#9A8DFF" font-size="13">熱流得快</text>
    <text x="520" y="350" fill="#FFFFFF" font-size="13">→ 覺得冰</text>

    <rect x="625" y="240" width="110" height="28" rx="4" fill="#F2803C"/>
    <text x="680" y="259" fill="#FFFFFF" font-size="15" font-weight="700">25°C</text>
    <text x="680" y="290" fill="#FFFFFF" font-size="14">木頭</text>
    <text x="680" y="310" fill="#585B63" font-size="12">導熱率 0.12</text>
    <text x="680" y="332" fill="#9A8DFF" font-size="13">熱流得慢</text>
    <text x="680" y="350" fill="#FFFFFF" font-size="13">→ 不覺得冰</text>

    <!-- 底部：冰塊驗證 -->
    <line x1="40" y1="382" x2="760" y2="382" stroke="#585B63" stroke-width="1"/>
    <text x="400" y="408" fill="#FFFFFF" font-size="15" font-weight="700">冰塊驗證：兩塊同溫，但冰塊在金屬盤上融得明顯快</text>
    <text x="400" y="432" fill="#585B63" font-size="13">金屬若真的比較冷，冰應該融得更慢——融得快，證明它只是傳熱快</text>
  </g>
</svg>
