<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="左右對照：直覺以為空氣阻力把衛星拖慢後掉下來，實際上軌道越低速度越快">
 <defs>
  <marker id="ar-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
   <path d="M0 0 L10 5 L0 10 z" fill="#F2803C"/>
  </marker>
  <marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
   <path d="M0 0 L10 5 L0 10 z" fill="#2F7DE1"/>
  </marker>
  <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
   <path d="M0 0 L10 5 L0 10 z" fill="#585B63"/>
  </marker>
 </defs>
 <rect x="0" y="0" width="800" height="450" fill="#101114"/>
 <g font-family="system-ui, 'Noto Sans TC', sans-serif">

  <text x="400" y="32" fill="#FFFFFF" font-size="20" font-weight="bold" text-anchor="middle">阻力拿走的是軌道能量，不是速度</text>
  <line x1="400" y1="52" x2="400" y2="340" stroke="#585B63" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- 左：直覺 -->
  <text x="200" y="76" fill="#F2803C" font-size="17" font-weight="bold" text-anchor="middle">直覺：被拖慢，然後掉下來</text>
  <line x1="46" y1="300" x2="354" y2="300" stroke="#585B63" stroke-width="3"/>
  <text x="200" y="320" fill="#585B63" font-size="13" text-anchor="middle">地球表面</text>
  <rect x="86" y="120" width="18" height="18" fill="#F2803C"/>
  <line x1="110" y1="129" x2="190" y2="129" stroke="#F2803C" stroke-width="4" marker-end="url(#ar-o)"/>
  <rect x="150" y="176" width="18" height="18" fill="#F2803C"/>
  <line x1="174" y1="185" x2="222" y2="185" stroke="#F2803C" stroke-width="4" marker-end="url(#ar-o)"/>
  <rect x="214" y="232" width="18" height="18" fill="#F2803C"/>
  <line x1="238" y1="241" x2="262" y2="241" stroke="#F2803C" stroke-width="4" marker-end="url(#ar-o)"/>
  <path d="M232 250 Q268 282 286 298" fill="none" stroke="#585B63" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar-g)"/>
  <text x="200" y="348" fill="#FFFFFF" font-size="14" text-anchor="middle">速度箭頭越來越短</text>

  <!-- 右：實際 -->
  <text x="600" y="76" fill="#2F7DE1" font-size="17" font-weight="bold" text-anchor="middle">實際：軌道縮小，速度變快</text>
  <line x1="446" y1="300" x2="754" y2="300" stroke="#585B63" stroke-width="3"/>
  <text x="600" y="320" fill="#585B63" font-size="13" text-anchor="middle">地球表面</text>
  <path d="M474 148 Q544 178 642 254" fill="none" stroke="#585B63" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="470" y="120" width="18" height="18" fill="#2F7DE1"/>
  <line x1="494" y1="129" x2="518" y2="129" stroke="#2F7DE1" stroke-width="4" marker-end="url(#ar-b)"/>
  <rect x="556" y="176" width="18" height="18" fill="#2F7DE1"/>
  <line x1="580" y1="185" x2="628" y2="185" stroke="#2F7DE1" stroke-width="4" marker-end="url(#ar-b)"/>
  <rect x="640" y="232" width="18" height="18" fill="#2F7DE1"/>
  <line x1="664" y1="241" x2="744" y2="241" stroke="#2F7DE1" stroke-width="4" marker-end="url(#ar-b)"/>
  <text x="600" y="348" fill="#FFFFFF" font-size="14" text-anchor="middle">高度越低，速度箭頭越長</text>

  <!-- 下：能量的帳 -->
  <text x="400" y="382" fill="#9A8DFF" font-size="15" font-weight="bold" text-anchor="middle">掉下來的那段高度，釋放的位能剛好分成兩半</text>
  <rect x="180" y="396" width="220" height="34" fill="#2F7DE1"/>
  <rect x="400" y="396" width="220" height="34" fill="#F2803C"/>
  <text x="290" y="418" fill="#FFFFFF" font-size="15" text-anchor="middle">一半 → 變成速度</text>
  <text x="510" y="418" fill="#FFFFFF" font-size="15" text-anchor="middle">一半 → 被空氣磨掉</text>
 </g>
</svg>
