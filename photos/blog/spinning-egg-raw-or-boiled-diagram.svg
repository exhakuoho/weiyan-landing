<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="熟蛋與生蛋旋轉時內部跟轉情況的對照">
  <rect x="0" y="0" width="800" height="450" fill="#101114"/>
  <text x="400" y="42" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">同樣轉一下，裡面跟不跟得上</text>
  <line x1="400" y1="68" x2="400" y2="360" stroke="#585B63" stroke-width="1.5" stroke-dasharray="7 7"/>

  <text x="200" y="100" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" fill="#2F7DE1">熟蛋：整顆一起轉</text>
  <path d="M 200 126 C 238 130 256 180 256 214 C 256 256 232 284 200 284 C 168 284 144 256 144 214 C 144 180 162 130 200 126 Z" fill="#2F7DE1" fill-opacity="0.16" stroke="#2F7DE1" stroke-width="3"/>
  <ellipse cx="200" cy="222" rx="36" ry="42" fill="#2F7DE1" fill-opacity="0.55" stroke="#2F7DE1" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 174 222 A 26 26 0 0 1 226 222" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
  <polygon points="234,223 219,214 219,232" fill="#FFFFFF"/>
  <text x="200" y="310" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13" fill="#9BA0A8">裡面：同速</text>
  <path d="M 126 336 A 76 26 0 0 0 274 336" fill="none" stroke="#2F7DE1" stroke-width="4"/>
  <polygon points="284,331 263,323 266,343" fill="#2F7DE1"/>
  <text x="200" y="378" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="15" fill="#FFFFFF">殼和裡面同一個速度</text>

  <text x="600" y="100" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" fill="#F2803C">生蛋：裡面慢半拍</text>
  <path d="M 600 126 C 638 130 656 180 656 214 C 656 256 632 284 600 284 C 568 284 544 256 544 214 C 544 180 562 130 600 126 Z" fill="#F2803C" fill-opacity="0.12" stroke="#F2803C" stroke-width="3"/>
  <ellipse cx="600" cy="222" rx="36" ry="42" fill="#F2803C" fill-opacity="0.38" stroke="#F2803C" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 585 206 A 20 20 0 0 1 613 211" fill="none" stroke="#9A8DFF" stroke-width="3.5"/>
  <polygon points="620,216 607,205 604,220" fill="#9A8DFF"/>
  <text x="600" y="310" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13" fill="#9A8DFF">裡面：轉得少</text>
  <path d="M 526 336 A 76 26 0 0 0 674 336" fill="none" stroke="#F2803C" stroke-width="4"/>
  <polygon points="684,331 663,323 666,343" fill="#F2803C"/>
  <text x="600" y="378" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="15" fill="#FFFFFF">殼先轉，液體跟不上</text>

  <text x="400" y="412" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="17" fill="#9BA0A8">這個落差一直在磨，把轉的力氣吃掉</text>
  <text x="400" y="438" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#9A8DFF">按停再放手：熟蛋不動，生蛋自己再轉起來</text>
</svg>
