<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="左邊是以為發現新天體要找最亮的星點，右邊是實際上要找三個月間位置挪動的那一點">
 <rect x="0" y="0" width="800" height="450" fill="#101114"/>
 <text x="400" y="30" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">發現新天體，靠的不是「比較亮」</text>

 <!-- 左：一般認知 -->
 <text x="212" y="60" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="14" fill="#585B63">一般以為</text>
 <rect x="40" y="72" width="345" height="232" rx="8" fill="#16171b" stroke="#585B63" stroke-width="1"/>
 <g fill="#FFFFFF">
  <circle cx="78" cy="110" r="1.6"/><circle cx="131" cy="96" r="1.1"/><circle cx="168" cy="134" r="1.8"/>
  <circle cx="226" cy="101" r="1.2"/><circle cx="284" cy="124" r="1.6"/><circle cx="337" cy="104" r="1.1"/>
  <circle cx="63" cy="176" r="1.2"/><circle cx="117" cy="208" r="1.7"/><circle cx="196" cy="186" r="1.2"/>
  <circle cx="258" cy="212" r="1.5"/><circle cx="312" cy="178" r="1.2"/><circle cx="356" cy="214" r="1.6"/>
  <circle cx="88" cy="258" r="1.5"/><circle cx="150" cy="276" r="1.1"/><circle cx="229" cy="262" r="1.7"/>
  <circle cx="292" cy="284" r="1.2"/><circle cx="346" cy="258" r="1.3"/><circle cx="196" cy="240" r="1.1"/>
 </g>
 <circle cx="212" cy="168" r="7" fill="#2F7DE1"/>
 <circle cx="212" cy="168" r="13" fill="none" stroke="#2F7DE1" stroke-width="1.5" opacity="0.5"/>
 <circle cx="212" cy="168" r="26" fill="none" stroke="#2F7DE1" stroke-width="1.5" stroke-dasharray="5 4"/>
 <text x="212" y="226" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13" fill="#2F7DE1">找最亮的那一顆</text>
 <text x="212" y="330" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="14" fill="#FFFFFF">以為：天上多了一個新亮點</text>

 <!-- 右：實際 -->
 <text x="588" y="60" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="14" fill="#585B63">實際上</text>
 <rect x="415" y="72" width="345" height="232" rx="8" fill="#16171b" stroke="#585B63" stroke-width="1"/>
 <g fill="#FFFFFF">
  <circle cx="453" cy="110" r="1.6"/><circle cx="506" cy="96" r="1.1"/><circle cx="543" cy="134" r="1.8"/>
  <circle cx="601" cy="101" r="1.2"/><circle cx="659" cy="124" r="1.6"/><circle cx="712" cy="104" r="1.1"/>
  <circle cx="438" cy="176" r="1.2"/><circle cx="492" cy="208" r="1.7"/><circle cx="571" cy="186" r="1.2"/>
  <circle cx="633" cy="212" r="1.5"/><circle cx="687" cy="178" r="1.2"/><circle cx="731" cy="214" r="1.6"/>
  <circle cx="463" cy="258" r="1.5"/><circle cx="525" cy="276" r="1.1"/><circle cx="604" cy="262" r="1.7"/>
  <circle cx="667" cy="284" r="1.2"/><circle cx="721" cy="258" r="1.3"/><circle cx="571" cy="240" r="1.1"/>
 </g>
 <line x1="533" y1="168" x2="641" y2="152" stroke="#9A8DFF" stroke-width="1.2" stroke-dasharray="4 4"/>
 <circle cx="533" cy="168" r="4.5" fill="#F2803C" opacity="0.45"/>
 <circle cx="587" cy="160" r="4.5" fill="#F2803C" opacity="0.72"/>
 <circle cx="641" cy="152" r="5" fill="#F2803C"/>
 <text x="533" y="190" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="11" fill="#585B63">3/4</text>
 <text x="587" y="182" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="11" fill="#585B63">5/8</text>
 <text x="641" y="174" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="11" fill="#585B63">7/11</text>
 <text x="588" y="226" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13" fill="#F2803C">找位置會挪的那一顆</text>
 <text x="588" y="330" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="14" fill="#FFFFFF">實際：背景星不動，只有它挪了</text>

 <!-- 下方：角度尺 -->
 <text x="40" y="372" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13" fill="#585B63">它一天在天空上挪過的角度（同比例尺，1 角分 ＝ 10 像素）</text>
 <rect x="100" y="396" width="310" height="10" fill="#585B63" opacity="0.35"/>
 <rect x="100" y="396" width="13" height="10" fill="#F2803C"/>
 <line x1="100" y1="392" x2="100" y2="410" stroke="#FFFFFF" stroke-width="1"/>
 <line x1="113" y1="392" x2="113" y2="410" stroke="#F2803C" stroke-width="1"/>
 <line x1="410" y1="392" x2="410" y2="410" stroke="#FFFFFF" stroke-width="1"/>
 <text x="106" y="432" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="12" fill="#F2803C">1.3 角分</text>
 <text x="410" y="432" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="12" fill="#FFFFFF">31 角分 ＝ 滿月直徑</text>
 <text x="500" y="396" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="14" fill="#9A8DFF">一天只挪過滿月</text>
 <text x="500" y="416" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="14" fill="#9A8DFF">寬度的 1/24</text>
</svg>
