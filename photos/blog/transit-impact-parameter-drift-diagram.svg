<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="凌日路線從恆星盤面中央移到邊緣再移出盤面，亮度曲線從深長變成短淺最後平掉">
<rect x="0" y="0" width="800" height="450" fill="#101114"/>
<text x="40" y="38" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">凌日消失，不是行星消失——是路線滑出了恆星盤面</text>
<text x="40" y="63" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="14" fill="#585B63">衝擊參數 b ＝ 凌日路線離盤面中心的距離，以恆星半徑為尺</text>

<!-- column 1: b = 0.2 -->
<circle cx="150" cy="185" r="62" fill="#2F7DE1" fill-opacity="0.22" stroke="#2F7DE1" stroke-width="2"/>
<line x1="78" y1="185" x2="222" y2="185" stroke="#585B63" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="68" y1="173" x2="232" y2="173" stroke="#F2803C" stroke-width="2.5"/>
<circle cx="196" cy="173" r="7" fill="#F2803C"/>
<text x="150" y="106" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#F2803C">b ＝ 0.2</text>
<text x="150" y="272" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="14" fill="#FFFFFF">從盤面中央穿過</text>

<!-- column 2: b = 0.9 -->
<circle cx="400" cy="185" r="62" fill="#2F7DE1" fill-opacity="0.22" stroke="#2F7DE1" stroke-width="2"/>
<line x1="328" y1="185" x2="472" y2="185" stroke="#585B63" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="318" y1="129" x2="482" y2="129" stroke="#F2803C" stroke-width="2.5"/>
<circle cx="446" cy="129" r="7" fill="#F2803C"/>
<text x="400" y="106" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#F2803C">b ＝ 0.9</text>
<text x="400" y="272" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="14" fill="#FFFFFF">只擦到盤面邊緣</text>

<!-- column 3: b = 1.3 -->
<circle cx="650" cy="185" r="62" fill="#2F7DE1" fill-opacity="0.22" stroke="#2F7DE1" stroke-width="2"/>
<line x1="578" y1="185" x2="722" y2="185" stroke="#585B63" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="568" y1="104" x2="732" y2="104" stroke="#F2803C" stroke-width="2.5"/>
<circle cx="696" cy="104" r="7" fill="#F2803C"/>
<text x="650" y="86" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#F2803C">b ＝ 1.3</text>
<text x="650" y="272" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="14" fill="#FFFFFF">整條路線在盤面外</text>

<!-- light curves -->
<text x="40" y="310" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="13" fill="#585B63">地球看到的亮度</text>
<polyline points="78,330 112,330 120,364 180,364 188,330 222,330" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="150" y="391" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="14" fill="#9A8DFF">又深又長</text>
<polyline points="328,330 378,330 384,345 416,345 422,330 472,330" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="400" y="391" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="14" fill="#9A8DFF">又短又淺</text>
<polyline points="578,330 722,330" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="650" y="391" text-anchor="middle" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="14" fill="#9A8DFF">完全沒有凹陷</text>

<!-- bottom summary -->
<line x1="40" y1="410" x2="760" y2="410" stroke="#585B63" stroke-width="1"/>
<text x="40" y="435" font-family="system-ui, 'Noto Sans TC', sans-serif" font-size="15" fill="#FFFFFF">TOI-2535 b：b 每年增加約 0.16，七年累積約 1.1（0.16×7，自行換算）——越過 1 就不再凌日</text>
</svg>
